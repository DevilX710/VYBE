<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VYBE — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .admin {
      width: 100%;
      max-width: 500px;
      background: #151518;
      border: 1px solid #29292e;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 6px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0d0d0f;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .logout {
      background: #222;
      color: white;
      margin-top: 10px;
    }

    #status {
      margin-top: 18px;
      color: #aaa;
      text-align: center;
      line-height: 1.5;
    }

    #loginScreen,
    #uploadScreen {
      width: 100%;
    }

    #uploadScreen {
      display: none;
    }
  </style>
</head>

<body>

  <div class="admin">

    <!-- LOGIN -->

    <div id="loginScreen">

      <h1>VYBE Admin</h1>

      <div class="subtitle">
        Sign in to manage your music library
      </div>

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="Your email"
        autocomplete="email"
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Your password"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        SIGN IN
      </button>

      <div id="loginStatus"></div>

    </div>


    <!-- UPLOAD -->

    <div id="uploadScreen">

      <h1>VYBE Admin</h1>

      <div class="subtitle">
        Add a song to your library
      </div>

      <label>Song title</label>
      <input
        id="title"
        type="text"
        placeholder="Song title"
      >

      <label>Artist</label>
      <input
        id="artist"
        type="text"
        placeholder="Artist name"
      >

      <label>Album</label>
      <input
        id="album"
        type="text"
        placeholder="Album name"
      >

      <label>Cover image</label>
      <input
        id="cover"
        type="file"
        accept="image/*"
      >

      <label>Audio file</label>
      <input
        id="audio"
        type="file"
        accept="audio/*"
      >

      <button id="uploadBtn">
        UPLOAD SONG
      </button>

      <button id="logoutBtn" class="logout">
        LOG OUT
      </button>

      <div id="status"></div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>


  <script>

    const loginScreen =
      document.getElementById("loginScreen");

    const uploadScreen =
      document.getElementById("uploadScreen");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginStatus =
      document.getElementById("loginStatus");

    const status =
      document.getElementById("status");


    // -------------------------
    // CHECK EXISTING SESSION
    // -------------------------

    checkSession();


    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {
        showUploadScreen();
      }

    }


    // -------------------------
    // LOGIN
    // -------------------------

    loginBtn.addEventListener("click", login);


    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        loginStatus.textContent =
          "Enter your email and password.";

        return;
      }


      loginBtn.disabled = true;

      loginStatus.textContent =
        "Signing in...";


      const {
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


      if (error) {

        console.error(error);

        loginStatus.textContent =
          "❌ " + error.message;

        loginBtn.disabled = false;

        return;
      }


      loginStatus.textContent =
        "✅ Login successful!";

      showUploadScreen();

      loginBtn.disabled = false;

    }


    // -------------------------
    // SHOW UPLOAD SCREEN
    // -------------------------

    function showUploadScreen() {

      loginScreen.style.display = "none";
      uploadScreen.style.display = "block";

    }


    // -------------------------
    // LOGOUT
    // -------------------------

    logoutBtn.addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      uploadScreen.style.display = "none";
      loginScreen.style.display = "block";

      document.getElementById("password").value = "";

    });


    // -------------------------
    // UPLOAD SONG
    // -------------------------

    document
      .getElementById("uploadBtn")
      .addEventListener("click", uploadSong);


    async function uploadSong() {

      const title =
        document.getElementById("title").value.trim();

      const artist =
        document.getElementById("artist").value.trim();

      const album =
        document.getElementById("album").value.trim();

      const coverFile =
        document.getElementById("cover").files[0];

      const audioFile =
        document.getElementById("audio").files[0];


      if (!title || !artist || !audioFile) {

        status.textContent =
          "Please enter title, artist and audio file.";

        return;
      }


      uploadBtn.disabled = true;

      status.textContent =
        "Checking authentication...";


      try {

        const {
          data: { user },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {
          throw new Error(
            "Your session has expired. Please log in again."
          );
        }


        const timestamp = Date.now();


        // -------------------------
        // COVER
        // -------------------------

        let coverPath = null;
        let coverUrl = null;


        if (coverFile) {

          const extension =
            coverFile.name
              .split(".")
              .pop()
              .toLowerCase();


          coverPath =
            `${timestamp}-cover.${extension}`;


          status.textContent =
            "Uploading cover...";


          const {
            error
          } = await supabaseClient.storage
            .from("covers")
            .upload(
              coverPath,
              coverFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


          if (error) {
            throw error;
          }


          const {
            data
          } = supabaseClient.storage
            .from("covers")
            .getPublicUrl(coverPath);


          coverUrl =
            data.publicUrl;

        }


        // -------------------------
        // AUDIO
        // -------------------------

        const audioExtension =
          audioFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const audioPath =
          `${timestamp}-audio.${audioExtension}`;


        status.textContent =
          "Uploading music...";


        const {
          error: audioError
        } = await supabaseClient.storage
          .from("music")
          .upload(
            audioPath,
            audioFile,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


        if (audioError) {
          throw audioError;
        }


        const {
          data: audioData
        } = supabaseClient.storage
          .from("music")
          .getPublicUrl(audioPath);


        const audioUrl =
          audioData.publicUrl;


        // -------------------------
        // DATABASE
        // -------------------------

        status.textContent =
          "Saving song...";


        const {
          error: databaseError
        } = await supabaseClient
          .from("songs")
          .insert({
            title,
            artist,
            album: album || null,
            cover_url: coverUrl,
            audio_url: audioUrl
          });


        if (databaseError) {
          throw databaseError;
        }


        status.textContent =
          "✅ Song uploaded successfully!";


        document.getElementById("title").value = "";
        document.getElementById("artist").value = "";
        document.getElementById("album").value = "";
        document.getElementById("cover").value = "";
        document.getElementById("audio").value = "";


      } catch (error) {

        console.error("Upload error:", error);

        status.textContent =
          "❌ " +
          (error.message ||
          "Something went wrong.");

      }


      uploadBtn.disabled = false;

    }

  </script>

</body>
</html>
